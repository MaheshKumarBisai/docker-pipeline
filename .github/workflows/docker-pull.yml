
name: PR Validation and EC2 Deployment

on:
  # Run checks when a PR targets main
  pull_request:
    branches:
      - main

  # Deploy only when changes are pushed to main
  push:
    branches:
      - feature/PRreview

  # Allow manual execution
  workflow_dispatch:

jobs:
  # Job 1: Runs for pull requests and pushes to main
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Image
        run: docker pull nginx:alpine

      - name: Confirm Validation
        run: echo "PR validation completed successfully"

  # Job 2: Runs only after a push or merge to main
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Docker Container to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            'set -e
             docker pull nginx:alpine
             docker rm -f nginx-demo 2>/dev/null || true
             docker run -d \
               --name nginx-demo \
               --restart unless-stopped \
               -p 8081:80 \
               nginx:alpine
             docker ps'
